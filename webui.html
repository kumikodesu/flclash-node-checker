<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlClash 节点评分 · Docker</title>
<style>
body{margin:0;background:#f6f7f1;color:#193b30;font:16px system-ui,sans-serif}main{max-width:800px;margin:8vh auto;padding:32px;background:white;border-radius:20px}h1{font-size:28px}p{line-height:1.8}button,select{font:inherit;padding:12px 18px;border-radius:8px;border:1px solid #b6c8bd;margin:5px}button{background:#174b36;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}progress{width:100%;height:20px}#message{min-height:3em;overflow-wrap:anywhere}a{color:#175e42}small{display:block;line-height:1.8;color:#597166}
</style>
<main><h1>FlClash 节点评分</h1><p>读取本机当前配置，批量检测全部节点。网速占 20%，IPLark 占 40%，成功率占 20%，延迟占 10%，波动与可达性各占 5%。</p>
<label>协议 <select id="protocol"><option value="all">全部协议</option></select></label><button id="refresh">刷新协议</button><span id="count"></span>
<p><button id="start">一键测评全部节点</button><button id="stop" disabled>停止</button></p>
<progress id="progress" value="0" max="1"></progress><p id="message">正在读取配置……</p><p id="report"></p>
<small>每个节点最多下载 16 MiB；例如 56 个节点最多约 896 MiB。测试网络经过本机 Docker，结果可能与 Windows 直接测速不同。<br>切换 FlClash 配置后刷新协议即可；每批测评使用启动时的配置快照。报告包含地区、来源、缓存时间和 IPLark 安全验证提示；缺少 IP 分数的节点保留为待补全。</small></main>
<script>
const token='__TOKEN__';const $=id=>document.getElementById(id);
async function api(path,data){const r=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Checker-Token':token},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'请求失败');return j;}
async function refresh(){try{const j=await api('/api/protocols'),selected=$('protocol').value;$('protocol').replaceChildren(...j.protocols.map(p=>new Option(p==='all'?'全部协议':p,p)));if(j.protocols.includes(selected))$('protocol').value=selected;$('count').textContent=`${j.count} 个节点`;$('start').dataset.invalid='';}catch(e){$('count').textContent=e.message;$('start').dataset.invalid='yes';$('start').disabled=true;}}
async function status(){try{const j=await api('/api/status');$('start').disabled=j.running||!!$('start').dataset.invalid;$('stop').disabled=!j.running;$('refresh').disabled=j.running;$('protocol').disabled=j.running;$('progress').max=j.total||1;$('progress').value=j.done;$('message').textContent=j.message;$('report').replaceChildren();if(j.report){const a=document.createElement('a');a.href=j.report;a.target='_blank';a.textContent='查看评分报告（含地区、CSV / JSON 下载）';$('report').append(a);}}catch(e){$('message').textContent='服务连接失败：'+e.message;}}
$('refresh').onclick=refresh;$('start').onclick=async()=>{try{await api('/api/start',{protocol:$('protocol').value});await status();}catch(e){$('message').textContent=e.message;}};$('stop').onclick=async()=>{try{await api('/api/stop',{});await status();}catch(e){$('message').textContent=e.message;}};
refresh();setInterval(status,1500);
</script></html>
