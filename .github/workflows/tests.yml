name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t flclash-node-checker-test .
      - name: Unit tests (synthetic data, no external network)
        run: docker run --rm --network none --mount "type=bind,src=$PWD,dst=/tests,readonly" -w /tests flclash-node-checker-test python -E -s -m unittest test_checker test_docker
      - name: Browser bridge syntax
        run: docker run --rm --network none flclash-node-checker-test node --check /app/iplark_browser.mjs
      - name: Compose configuration
        run: |
          export FLCLASH_DIR=/tmp/flclash-test
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.cloakbrowser.yaml config --quiet
