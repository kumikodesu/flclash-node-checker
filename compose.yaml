name: flclash-node-checker
services:
  checker:
    build: .
    platform: linux/amd64
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FLCLASH_CONFIG: /data/imported-config.yaml
      TZ: Asia/Shanghai
      IPLARK_CDP_URL: ""
    volumes:
      - type: volume
        source: checker-data
        target: /data
    shm_size: 256mb
    mem_limit: 1g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  checker-data:
