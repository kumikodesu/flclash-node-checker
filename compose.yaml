name: flclash-node-checker
services:
  checker:
    build: .
    platform: linux/amd64
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FLCLASH_HOST_DIR: "${FLCLASH_DIR:?请在项目的 .env 中设置 FlClash 数据目录 FLCLASH_DIR}"
      TZ: Asia/Shanghai
      IPLARK_CDP_URL: ""
    volumes:
      - type: bind
        source: "${FLCLASH_DIR}"
        target: /flclash
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: checker-data
        target: /data
    shm_size: 256mb
    mem_limit: 1g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  checker-data:
